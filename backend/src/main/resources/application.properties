# --- Server ---
server.port=8080

# --- Database (H2 in-memory for local dev) ---
spring.datasource.url=jdbc:h2:mem:mediaclub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# IMPORTANT: override this via environment variable in real deployments, never commit a real secret
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
app.jwt.expiration-ms=86400000

# --- External APIs (set these as environment variables, do NOT hardcode / commit) ---
app.external.tmdb.api-key=${TMDB_API_KEY:}
app.external.rawg.api-key=${RAWG_API_KEY:}
