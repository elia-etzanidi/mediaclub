# --- Server ---
server.port=8080

# --- Database (PostgreSQL via Homebrew) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mediaclub
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.h2.console.enabled=false

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (Optional: to switch back to local H2 in-memory/file database)
# spring.datasource.url=jdbc:h2:file:./data/mediaclub;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JWT ---
# IMPORTANT: override this via environment variable in real deployments, never commit a real secret
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying}
app.jwt.expiration-ms=86400000

# --- External APIs (set these as environment variables, do NOT hardcode / commit) ---
app.external.tmdb.api-key=${TMDB_API_KEY:}
app.external.rawg.api-key=${RAWG_API_KEY:}
app.bootstrap-admin-username=${BOOTSTRAP_ADMIN_USERNAME:eliaetz}

# --- File / Payload Limits for Avatar Uploads ---
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
